name: terraform-plan

on:
  pull_request:
    branches: [dev, staging, main]

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  promotion-guard:
    name: Enforce promotion path
    runs-on: ubuntu-24.04
    steps:
      - name: check branches
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          case "$BASE" in
            main)    [ "$HEAD" = "staging" ] || fail "PRs to main must come from 'staging' (got '$HEAD')." ;;
            staging) [ "$HEAD" = "dev" ]     || fail "PRs to staging must come from 'dev' (got '$HEAD')." ;;
            dev)     case "$HEAD" in dev|staging|main) fail "PRs to dev must come from a feature branch." ;; esac ;;
          esac
          echo "OK: $HEAD -> $BASE"

  plan:
    name: Plan
    needs: promotion-guard
    runs-on: ubuntu-24.04
    env:
      TF_ENV: ${{ github.base_ref == 'main' && 'prod' || github.base_ref }}
      TF_IN_AUTOMATION: "true"
    defaults:
      run:
        working-directory: envs/${{ github.base_ref == 'main' && 'prod' || github.base_ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: fmt
        working-directory: .
        run: terraform fmt -check -recursive

      # read only role, repo variable PLAN_ROLE_ARN_<ENV>
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars[format('PLAN_ROLE_ARN_{0}', env.TF_ENV)] }}
          aws-region: eu-west-1

      - run: terraform init -input=false
      - run: terraform validate

      - name: Plan
        run: terraform plan -input=false -lock=false -no-color -out=tfplan 2>&1 | tee plan.txt; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const env = process.env.TF_ENV;
            let plan = fs.readFileSync(`envs/${env}/plan.txt`, 'utf8');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (truncated, see job log)';
            const marker = `<!-- tf-plan-${env} -->`;
            const body = `${marker}\n### Terraform plan → \`${env}\`\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
